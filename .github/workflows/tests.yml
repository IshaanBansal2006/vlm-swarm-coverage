name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Core install only — no [vlm], no [analysis]. If this step ever needs a
      # GPU stack to succeed, the rig has stopped being reproducible and the
      # failure should be loud.
      - name: Install (exactly what the README tells a visitor to run)
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Lint
        run: ruff check src tests

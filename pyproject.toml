[project]
name = "vlm-swarm-coverage"
version = "0.0.0"
description = "Simulation rig for decentralized multi-drone coverage driven by a vision-language model."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ishaan Bansal" }]
license = { text = "MIT" }

# Deliberately minimal. The model and analysis stacks are OPTIONAL extras, not
# core: the rig must stay importable and testable on a machine with no GPU and
# no model weights. If the core ever needs torch to import, the test suite stops
# being runnable in CI and the whole thing stops being reproducible.
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Model inference. Split out so CI and the analysis path never pull it.
vlm = [
    "torch>=2.2",
    "transformers>=4.40",
    "pillow>=10.0",
]
# Analysis and plotting.
analysis = [
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pot>=0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "ipython",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlm_swarm_coverage"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]
# N803/N806: mathematical notation (S, P, L, W) is clearer than snake_case for
# covariances, factors and cost matrices, and matches the papers being cited.
ignore = ["E501", "N803", "N806"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
